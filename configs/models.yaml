# Сравнение семейств моделей на одних данных, признаках и окнах.
#
# Запуск: python -m scripts.run_backtest --config models
#
# У всех глобальных моделей одинаковый набор признаков (кроме target_month:
# при обучении на январе–сентябре модель не видит октябрь–декабрь и
# переносит на них поведение сентября) и один бюджет: ~400 деревьев,
# скорость обучения 0.03. Цель – рост г/г, вес наблюдения – уровень
# расходов, поэтому оптимизируется MAE в рублях.
#
# Кроме метрик скрипт считает корреляцию ошибок между моделями и MAE
# ансамблей: ансамбль тем полезнее, чем меньше похожи ошибки.
seed: 42
# прогноз вперёд из последнего месяца данных теми же моделями
# (reports/backtest/models/forecast.parquet) – его показывает приложение
forecast: true

data:
  panel: data/processed/spending_mo.parquet
  categories: [all]
  full_history_only: true

backtest:
  horizon: 3
  n_windows: 7               # месячные окна 2024-03…09: три окна дают
  step: 1                    # слишком шумный выбор модели (одно окно решает выбор)
  min_train: 12
  n_jobs: -1
  # Честная проверка ансамбля (src/eval/ensemble.py: holdout_selection): состав
  # выбирается только по точкам с датой ≤ known_until – всё, что известно к
  # прогнозу из eval_from, – и оценивается на окнах с origin ≥ eval_from.
  holdout: {known_until: "2024-07-01", eval_from: "2024-07-01"}

models:
  # Фундаментальные модели (предобученные нейросети, без дообучения): прогноз
  # ряда роста г/г, уровень = прошлогоднее значение × прогноз роста.
  - name: chronos
    model: foundation
    params: {backend: chronos, mode: growth}
  - name: timesfm
    model: foundation
    params: {backend: timesfm, mode: growth}

  # Базовый уровень: тот же месяц год назад × текущий рост г/г.
  - name: baseline
    model: seasonal_naive_drift
    params: {k: 3}

  - name: lightgbm
    model: global
    params:
      backend: lightgbm
      # Общий список исключённых признаков (&exclude) – для всех деревьев ниже.
      # Новости, GDELT, акты о ЧС и ряды ЕМИСС в формах count/flag/dev/lag6 и
      # level/rel/mom3 по 4 seed на CatBoost тоже без выигрыша
      # (features_events_catboost, features_forms_catboost) и в модель не подаются.
      exclude_features: &exclude [target_month,
                         # без пользы в features_cmp (наборы ext и sme)
                         basket_cost_yoy, housing_price_m2_primary_yoy, housing_price_m2_secondary_yoy, loans_corporate_yoy,
                         loans_sme_issued_yoy, loans_sme_debt_yoy, loans_sme_overdue_yoy,
                         # цены на топливо и ЖКУ (ЕМИСС 31448): 4 seed – LightGBM −1,3%, CatBoost +1,0%, не включены
                         prices_fuel_utilities_ai92_yoy, prices_fuel_utilities_diesel_yoy, prices_fuel_utilities_power_yoy, prices_fuel_utilities_water_cold_yoy,
                         prices_fuel_utilities_water_hot_yoy, prices_fuel_utilities_heating_yoy, prices_fuel_utilities_gas_yoy]
      n_estimators: 400
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      random_state: 42

  - name: xgboost
    model: global
    params:
      backend: xgboost
      exclude_features: *exclude
      n_estimators: 400
      learning_rate: 0.03
      max_depth: 6
      min_child_weight: 20
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1

  # Среднее 4 seed: одна модель заметно зависит от seed (разброс MAE около 2%),
  # среднее четырёх моделей с seed 1–4 убирает этот разброс (998 ₽).
  - name: catboost
    model: global
    params:
      backend: catboost
      exclude_features: *exclude
      iterations: 400
      learning_rate: 0.03
      depth: 6
      seeds: [1, 2, 3, 4]

  # Быстрая замена классическому GradientBoosting из sklearn.
  - name: hist_gbm
    model: global
    params:
      backend: hist_gbm
      exclude_features: *exclude
      max_iter: 400
      learning_rate: 0.03
      max_leaf_nodes: 31
      min_samples_leaf: 40
      random_state: 42

  # Деревья независимы и усредняются: ошибки должны отличаться от бустинга.
  # Обучается на квадратичной ошибке (критерий MAE в sklearn слишком медленный).
  - name: random_forest
    model: global
    params:
      backend: random_forest
      exclude_features: *exclude
      n_estimators: 300
      min_samples_leaf: 5
      max_features: 0.5
      random_state: 42
      n_jobs: -1

  # Линейная модель: единственная, кто экстраполирует за пределы обучения.
  # Признаки уровня месяца (одно значение на все МО: общий рост, курс, ИПЦ,
  # календарь, сезонный шаг) в обучении принимают 3–9 значений – прямая по
  # ним на новом месяце уходит далеко (MAE 2 530 ₽ против 1 235 без них).
  # Деревья за пределы виденного не выходят, им эти признаки оставлены.
  - name: ridge
    model: global
    params:
      backend: ridge
      exclude_features: [target_month, seas_step, common_g1, common_g1_prev,
                         cal_workdays, cal_workdays_yoy, cal_workdays_yoy_t,
                         cal_holidays_on_weekdays, cal_long_weekend_max,
                         cpi_yoy, cpi_food_yoy, usd_mom, usd_yoy,
                         # без пользы в features_cmp (наборы ext и sme)
                         basket_cost_yoy, housing_price_m2_primary_yoy, housing_price_m2_secondary_yoy, loans_corporate_yoy,
                         loans_sme_issued_yoy, loans_sme_debt_yoy, loans_sme_overdue_yoy,
                         # цены на топливо и ЖКУ (ЕМИСС 31448): 4 seed – LightGBM −1,3%, CatBoost +1,0%, не включены
                         prices_fuel_utilities_ai92_yoy, prices_fuel_utilities_diesel_yoy, prices_fuel_utilities_power_yoy, prices_fuel_utilities_water_cold_yoy,
                         prices_fuel_utilities_water_hot_yoy, prices_fuel_utilities_heating_yoy, prices_fuel_utilities_gas_yoy]
      alpha: 1.0

  # --- Модели на отклонении МО от общего фактора (src/forecast/factor.py) ---
  # Фактор – медиана log-расходов по МО в месяце: сезонность по тысяче рядов
  # вместо шумной сезонности одного ряда. k – стягивание регионального
  # фактора к национальному (inf – национальный, 0 – чисто региональный).
  - name: factor_only
    model: factor
    params: {method: factor_only, k: inf}
  - name: ets_rel
    model: factor
    params: {method: ets, k: inf}
  - name: ets_rel_reg
    model: factor
    params: {method: ets, k: 0}
  - name: chronos_base_rel
    model: foundation
    params: {backend: chronos, weights: chronos-bolt-base, mode: relative, k: inf}
  - name: chronos_base_rel_reg
    model: foundation
    params: {backend: chronos, weights: chronos-bolt-base, mode: relative, k: 0}

  # Ансамбль: chronos и ETS на национальном и региональном факторе, baseline
  # (прошлый год × рост) и два бустинга на признаках. Модели на разных
  # факторах ошибаются по-разному, среднее гасит ошибки; бустинги страхуют от
  # смены режима роста, которую фактор не видит (окно 2024-03: рост г/г
  # прыгнул с ~9% в I кв. до ~17% в апреле–июне, модели на факторе
  # недооценили все МО). Сравнение на 7 месячных окнах 2024-03…09:
  #   без бустингов 870, с random_forest и catboost 841, вариант из chronos,
  #   ETS на национальном факторе и baseline 915 (первая версия панели).
  # Состав выбран после просмотра всех окон (правило «выбор на 03–06,
  # проверка на 07–09» дало неустойчивый ответ: разницы в пределах шума),
  # поэтому имя с ens_ – приложение сравнивает его честно только на
  # последнем окне.
  - name: ens_eq[factor_mix]
    model: ensemble
    params:
      members: [chronos_base_rel, ets_rel, chronos_base_rel_reg, ets_rel_reg, baseline,
                random_forest, catboost]
      # без весов chronos-bolt-base (новая машина, python -m worker models не
      # запускался) – ансамбль из оставшихся 5, с предупреждением в логе,
      # статусе прогона и приложении
      min_members: 4

  # Среднее всех моделей выше, без выбора состава. Скользящая проверка
  # (rolling_selection.csv: на каждом окне способ видит только известное к
  # нему) – любой выбор по прошлой ошибке хуже простого среднего: среднее всех
  # 795 ₽, жадный выбор 901, лучшая модель по прошлому 1089 (окна 2024-05…09).
  # Лидеры одних окон проваливаются на следующих (LightGBM: 862 в мае, 1315 в августе).
  # Состав не подбирается на окнах, поэтому имя без ens_ и MAE честная.
  - name: mean_all
    model: ensemble
    params:
      members: [chronos, timesfm, baseline, lightgbm, xgboost, catboost, hist_gbm, random_forest,
                ridge, factor_only, ets_rel, ets_rel_reg, chronos_base_rel, chronos_base_rel_reg]
      min_members: 10
