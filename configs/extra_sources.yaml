# Дополнительные источники: регионы (ЕМИСС, ЦБ) и вакансии по МО («Работа России»).
#
#   python -m scripts.download_extra [--only emiss,cbr,trudvsem,fns,treasury]
#
# У ЕМИСС для каждого показателя – какие срезы брать (keep): название
# измерения -> регулярное выражение по подписям значений; year_from – с какого
# года; split – несколько рядов из одного показателя: суффикс столбца ->
# регулярное выражение по подписям (или список – все должны совпасть). Без
# фильтра выгрузки некоторых показателей – сотни мегабайт. Ручные .xls
# частями по годам: <id>_<name>_<годы>.xls – склеиваются. ytd_until –
# до какого года ряд split шёл нарастающим итогом (переводится в месяцы).

emiss:
  - id: 57039
    name: income_per_capita          # среднедушевые денежные доходы
    year_from: 2010
  - id: 59577
    name: poverty_rate               # уровень бедности, %
  - id: 43418
    name: unemployment_registered    # уровень регистрируемой безработицы, %
  - id: 31052
    name: basket_cost                # стоимость фиксированного набора товаров и услуг
    year_from: 2017
  - id: 31448
    name: prices_fuel_utilities      # цены на топливо и ЖКУ
    year_from: 2017
    keep:
      "Виды товаров и услуг": "^(Бензин автомобильный марки АИ-92, л|Дизельное топливо, л|Электроэнергия в квартирах без электроплит за минимальный|Водоснабжение холодное и водоотведение, м3|Водоснабжение горячее, м3|Отопление, Гкал|Газ сетевой, м3)"
    split:                           # по ряду на товар: prices_fuel_utilities_<товар>
      ai92: "^Бензин автомобильный марки АИ-92, л$"
      diesel: "^Дизельное топливо, л$"
      power: "^Электроэнергия в квартирах без электроплит за минимальный"
      water_cold: "^Водоснабжение холодное и водоотведение, м3$"
      water_hot: "^Водоснабжение горячее, м3$"
      heating: "^Отопление, Гкал$"
      gas: "^Газ сетевой, м3$"
  - id: 31452
    name: housing_price_m2           # средняя цена 1 кв. м жилья
    year_from: 2010
    keep:
      "Типы квартир": "^Все типы квартир"
    split:                           # по ряду на рынок: housing_price_m2_primary / _secondary
      primary: "^Первичный рынок"
      secondary: "^Вторичный рынок"
  - id: 42861
    name: loans_households           # задолженность по кредитам физлицам (в рублях)
    year_from: 2017
    keep:
      "Характеристики кредита": "^По кредитам всего"
  - id: 39619
    name: loans_sme                  # кредиты МСП и ИП: выдачи, долг, просрочка
    year_from: 2017
    keep:
      "Вид валюты": "^в рублях"
      "Заёмщик": "^субъекты малого и среднего"   # ИП – часть МСП
    split:
      issued: "^Объем предоставленных кредитов"
      debt: "^Задолженность"
      overdue: "^в том числе: просроченная задолженность"
    ytd_until:                       # выдачи 2017–2018 – нарастающим итогом, с 2019 – за месяц
      issued: 2018
  - id: 63384
    name: loans_corporate            # задолженность юрлиц и ИП по кредитам
    keep:
      "Вид валюты": "^Итого"

cbr:
  - name: deposits_households        # вклады (депозиты) физлиц по регионам
    url: https://www.cbr.ru/vfs/statistics/BankSector/Borrowings/02_06_Dep_ind.xlsx

trudvsem:
  # официальная ежедневная выгрузка всех вакансий (~2 ГБ, читается потоком);
  # API не годится: не больше 10 000 вакансий на запрос и ~9 с на страницу
  dump_url: https://opendata.trudvsem.ru/csv/vacancy.csv

fns:
  # Форма 1-НМ (поступления налогов), ежемесячно, все субъекты в одном
  # архиве *reg.zip. По МО ФНС публикацию приостановила до 01.04.2027.
  # Страницы годов ищутся на странице форм в строке 1-НМ (рядом с набором
  # открытых данных 7707329152-nmpn).
  index_url: https://www.nalog.gov.ru/rn77/related_activities/statistics_and_analytics/forms/
  year_from: 2021
