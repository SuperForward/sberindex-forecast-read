# Сравнение детекторов структурных сдвигов (CPD).
#
# Запуск: python -m scripts.run_cpd --config cpd
#
# Размеченных сдвигов в данных СберИндекса нет, поэтому качество меряем на
# синтетике: 10% МО с известного месяца τ уровень расходов сдвигается
# на s (−5…−15%), остальные остаются как есть (сдвигов мало, как и в жизни,
# иначе они исказят общую для всех МО медиану). Порог каждого метода
# подбирается так, чтобы на «чистых» МО ложная тревога за 2024 г. была у 5%
# рядов (per-series FAR). При этом пороге сравнивается доля зафиксированных сдвигов
# в окне [τ, τ+2] и средняя задержка. Затем лучший метод проверяется на
# реальных паводках апреля 2024 г.
seed: 42
category: all

synthetic:
  share: 0.1
  sizes: [-0.05, -0.10, -0.15]
  months: ["2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10"]
  detect_window: 2        # тревога засчитывается в [τ, τ + 2] месяцев
  repeats: 10             # разные случайные разметки, метрики по всем вместе
  # как сдвиг проходит в пять категорий (для детекторов по категориям):
  # same – так же, как во все расходы; random – в каждой s·U(0, 2);
  # total_only – только в расходы вне категорий. Полнота при 5% ложных
  # (EWMA): все расходы 0,38 при любом режиме; категории 0,40 / 0,40 / 0,02;
  # больший из двух сигналов (ewma_mix) 0,42 / 0,44 / 0,33. Берём random:
  # реальные паводки били по категориям по-разному.
  category_shift: random

# Другие формы сдвига – проверка, что выбор детектора не держится на одной
# форме: рост вместо падения и временный провал на 2 месяца (паводок с
# быстрой компенсацией). Те же МО, месяцы и доля ложных тревог.
scenarios:
  - {name: up, title: "рост +5…+15%", sizes: [0.05, 0.10, 0.15]}
  - {name: temporary, title: "временный провал −10…−20%, 2 мес.", sizes: [-0.10, -0.15, -0.20], duration: 2}

# Первый месяц мониторинга (индекс в ряду 2024 г.): детекторам нужны хотя бы
# два предыдущих месяца как опорный уровень.
monitor_start: 2

far_targets: [0.05, 0.10, 0.20, 0.30]
main_far: 0.05
# вторая шкала: ложные тревоги на 100
# рядо-месяцев чистых МО (порог калибруется по ней отдельно)
far_rate_targets: [0.5, 1, 3]

# Порог не задаётся руками: он вычисляется из целевой доли ложных тревог.
methods:
  zscore: {}
  ewma: {alpha: 0.3}
  cusum: {k: 0.5}
  bocpd: {hazard: 0.0833}
  pelt: {}                                 # офлайн, для сравнения
  # фундаментальная модель: факт вне интервала прогноза Chronos-Bolt
  chronos_interval: {}
  # та же модель, отклонение в «сигмах» МО (как у z-порога и EWMA)
  chronos_median: {}
  # абляция: тот же z-порог без вычитания общего для всех МО сдвига
  zscore_no_common: {base: zscore, remove_common: false}
  # сигнал по категориям (src/cpd/series.py::category_z) вместо всех расходов:
  # паводки 2024 г. в маркетплейсах, здоровье и транспорте видны сильнее, чем
  # в сумме. Общепит не берём: у мелких МО редкие траты дают скачки в сотни σ.
  # На синтетике сдвиг вставляется во все категории одинаково.
  ewma_cat: {base: ewma, alpha: 0.3, categories: [food, health, marketplaces, transport]}
  zscore_cat: {base: zscore, categories: [food, health, marketplaces, transport]}
  # больший из двух нормированных сигналов: все расходы и категории. Один
  # сигнал по категориям не видит сдвиг вне пяти категорий (~28% расходов).
  ewma_mix: {base: ewma, alpha: 0.3, categories: [food, health, marketplaces, transport], with_total: true}
  zscore_mix: {base: zscore, categories: [food, health, marketplaces, transport], with_total: true}

# Реальные сдвиги: паводки 2024 г. (reference/shocks_events.csv)
real_events:
  - {oktmo: "71705000", name: "Ишим", month: "2024-04"}
  - {oktmo: "71626000", name: "Ишимский район", month: "2024-04"}
  - {oktmo: "71603000", name: "Абатский район", month: "2024-04"}
  - {oktmo: "53723000", name: "Орск", month: "2024-04"}
  - {oktmo: "37701000", name: "Курган", month: "2024-04"}
  # Оренбург – 35 новостей о подтоплении о самом городе (04.2024, news_matches);
  # других МО панели с новостями о паводке больше одной нет. Акты о ЧС МО не
  # называют, поэтому реестр из них не пополнить.
  - {oktmo: "53701000", name: "Оренбург", month: "2024-04"}
