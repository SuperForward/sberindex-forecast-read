# Вклад новых признаков: LightGBM на пяти наборах, по 4 seed (разброс между
# seed – мерило шума).
#   old  – признаки до расширения;
#   pmo  – + показатели ПМО, МСП, естественный прирост, вклады;
#   full – + кредиты, доходы, бедность (ЕМИСС), НДФЛ и налоги в местные
#          бюджеты (ФНС 1-НМ);
#   ext  – + стоимость набора, цена жилья (первичный и вторичный
#          рынок), кредиты юрлицам и ИП (ЕМИСС);
#   sme  – full + кредиты МСП: выдачи, долг, просрочка (ЕМИСС).
# Окна и ряды – как в models.yaml.
#
# Запуск: python -m scripts.run_backtest --config features_cmp
seed: 42
data:
  panel: data/processed/spending_mo.parquet
  categories:
  - all
  full_history_only: true
backtest:
  horizon: 3
  n_windows: 3
  step: 3
  min_train: 12
  n_jobs: -1
models:
- name: baseline
  model: seasonal_naive_drift
  params:
    k: 3
- name: lgbm_old_s1
  model: global
  params:
    backend: lightgbm
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 1
    exclude_features:
    - target_month
    - prices_fuel_utilities_ai92_yoy
    - prices_fuel_utilities_diesel_yoy
    - prices_fuel_utilities_power_yoy
    - prices_fuel_utilities_water_cold_yoy
    - prices_fuel_utilities_water_hot_yoy
    - prices_fuel_utilities_heating_yoy
    - prices_fuel_utilities_gas_yoy
    - basket_cost_yoy
    - housing_price_m2_primary_yoy
    - housing_price_m2_secondary_yoy
    - loans_corporate_yoy
    - loans_sme_issued_yoy
    - loans_sme_debt_yoy
    - loans_sme_overdue_yoy
    - sme_per_10k
    - sme_emp_share
    - deposits_households_yoy
    - catering_turnover_log
    - catering_turnover_growth
    - investment_pc_log
    - investment_pc_growth
    - housing_pc_log
    - housing_pc_growth
    - admin_spend_pc_log
    - admin_spend_pc_growth
    - wage_large_log
    - wage_large_growth
