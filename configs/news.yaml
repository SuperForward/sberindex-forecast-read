# Новости: источник, период, правила привязки.
#
#   python -m scripts.download_news     – архив Lenta.ru по дням (рубрики ниже)
#   python -m scripts.build_news        – тип шока, привязка к МО/региону, агрегаты
#   python -m scripts.run_news_eval     – проверка пользы: детектор сдвигов и прогноз
#
# Храним только заголовок, время публикации, рубрику и ссылку – без текстов статей.

source: lenta
rubrics: [russia, economics]
date_from: "2023-01-01"          # период панели СберИндекса по МО – с января 2023
pause_s: 1.5                     # пауза между запросами: не нагружаем чужой сайт
refetch_days: 3                  # последние N дней перекачиваются (новости дня дописываются)

# Привязка ко времени: новость «существует» с момента публикации. Для прогноза
# или решения детектора на месяц t используются только новости, опубликованные
# до конца месяца t.
# Уровень МО – если муниципалитет назван; иначе уровень региона.
# Вес новости о регионе в целом для каждого его МО (своё упоминание МО – вес 1).
region_weight: 0.3
# Новость в признаки – только если модель уверена в типе не меньше min_p
# (ниже – чаще ошибка: «долг перед Москвой» как бюджет Москвы).
min_p: 0.5

# GDELT 2.0, поток translation (python -m scripts.download_gdelt): события
# из неанглоязычных СМИ с местом действия в России, закодированные по CAMEO.
gdelt:
  date_from: "2023-01-01"
  workers: 8                     # параллельных загрузок (файлы в Google Cloud Storage)
