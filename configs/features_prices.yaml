    - loans_sme_issued_yoy
    - loans_sme_debt_yoy
    - loans_sme_overdue_yoy
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 1
- name: lgbm_prices_s2
  model: global
  params:
    backend: lightgbm
    exclude_features: *id002
