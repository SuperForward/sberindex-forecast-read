# Вклад цен на топливо и ЖКУ (ЕМИСС 31448): LightGBM с признаками основной
# модели (cur) и с ними же плюс 7 рядов цен г/г (prices), по 4 seed – разброс
# между seed служит мерилом шума. Окна и ряды – как в models.yaml.
#
# Запуск: python -m scripts.run_backtest --config features_prices
seed: 42
data:
  panel: data/processed/spending_mo.parquet
  categories:
  - all
  full_history_only: true
backtest:
  horizon: 3
  n_windows: 7
  step: 1
  min_train: 12
  n_jobs: -1
models:
- name: baseline
  model: seasonal_naive_drift
  params:
    k: 3
- name: lgbm_cur_s1
  model: global
  params:
    backend: lightgbm
    exclude_features: &id001
    - target_month
    - basket_cost_yoy
    - housing_price_m2_primary_yoy
    - housing_price_m2_secondary_yoy
    - loans_corporate_yoy
    - loans_sme_issued_yoy
    - loans_sme_debt_yoy
    - loans_sme_overdue_yoy
    - prices_fuel_utilities_ai92_yoy
    - prices_fuel_utilities_diesel_yoy
    - prices_fuel_utilities_power_yoy
    - prices_fuel_utilities_water_cold_yoy
    - prices_fuel_utilities_water_hot_yoy
    - prices_fuel_utilities_heating_yoy
    - prices_fuel_utilities_gas_yoy
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 1
- name: lgbm_cur_s2
  model: global
  params:
    backend: lightgbm
    exclude_features: *id001
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 2
- name: lgbm_cur_s3
  model: global
  params:
    backend: lightgbm
    exclude_features: *id001
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 3
- name: lgbm_cur_s4
  model: global
  params:
    backend: lightgbm
    exclude_features: *id001
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 4
- name: lgbm_prices_s1
  model: global
  params:
    backend: lightgbm
    exclude_features: &id002
    - target_month
    - basket_cost_yoy
