# Точность прогноза на горизонтах 1, 3, 6 и 12 месяцев.
#
# Запуск: python -m scripts.run_horizons --config horizons
#
# Все горизонты проверяются на одних и тех же целевых месяцах (июль–декабрь
# 2024 г.): для горизонта H прогноз строится из месяца «цель − H» и берётся
# ровно H-й шаг. Так разница в MAE между горизонтами – это цена дальности
# прогноза, а не разница между месяцами.
#
# Честные ограничения при 24 месяцах истории:
#  - H=12: прогноз строится из 2023-07…2023-12, когда история короче года.
#    Сезонный наивный прогноз тут совпадает с наивным (месяц «цель − 12» и
#    есть последний известный), Prophet учится на 7–12 точках, а глобальные
#    модели не могут обучиться совсем (нет ни одного известного роста г/г) –
#    в таблице «н/д».
#  - baseline (seasonal_naive_drift) требует 15 месяцев истории: при H=6 из
#    ранних окон (01–02.2024) его не построить, при H=12 – ни из одного → н/д.
#  - Модель, покрывшая не все целевые месяцы, получает «н/д»: иначе её MAE
#    считалась бы на других точках.
#  - Для 6 и 12 месяцев есть national_growth: тот же месяц год назад × рост
#    расходов по России из дашборда СберИндекса (ряд с 2018 г., известен на
#    дату прогноза) – ему не нужен рост г/г самого МО.
seed: 42

data:
  panel: data/processed/spending_mo.parquet
  categories: [all]
  full_history_only: true

horizons: [1, 3, 6, 12]
targets: ["2024-07", "2024-08", "2024-09", "2024-10", "2024-11", "2024-12"]
min_train: 6
n_jobs: -1

# Ансамбль без выбора по тестовым месяцам: простое среднее всех глобальных
# моделей, кроме ridge. Исключён, когда из-за ошибки реализации был вдвое
# хуже baseline (docs/report.md, 4.2); после исправления состав ансамбля не
# меняли, чтобы не подбирать его под уже известные тестовые результаты.
ensemble: {name: "ens_eq[global]", exclude: [ridge]}

# Модели берутся из configs/models.yaml (те же параметры) плюс Prophet и
# наивные прогнозы из configs/default.yaml.
model_configs: [default, models]
# seasonal_naive_drift – то же, что baseline в models.yaml; prophet_yearly3
# хуже prophet_default в основном backtest и удвоил бы время прогона.
skip_models: [seasonal_naive_drift, prophet_yearly3]

# Фундаментальные модели по уровням: единственный вариант для горизонта 12
# месяцев (из 2023 г. роста г/г ещё нет), на остальных – для сравнения.
extra_models:
  # Тот же месяц год назад × рост по России (% г/г, дашборд СберИндекса) за
  # месяц «origin − lag»: lag = 1 – запас на задержку публикации.
  - name: national_growth
    model: seasonal_naive_national
    params: {lag: 1}
  - name: chronos_level
    model: foundation
    params: {backend: chronos, mode: level}
  - name: timesfm_level
    model: foundation
    params: {backend: timesfm, mode: level}
