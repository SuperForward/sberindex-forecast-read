# Глобальная LightGBM против лучшего локального baseline.
# Окна и ряды – как в default.yaml, чтобы метрики сравнивались напрямую
# (Prophet из reports/backtest/default).
seed: 42

data:
  panel: data/processed/spending_mo.parquet
  categories: [all]
  full_history_only: true

backtest:
  horizon: 3
  n_windows: 3
  step: 3
  min_train: 12
  n_jobs: -1

models:
  - name: seasonal_naive_drift
    model: seasonal_naive_drift
    params: {k: 3}
  - name: lgbm_global
    model: global
    params:
      # без пользы в features_cmp (наборы ext и sme)
      exclude_features: [basket_cost_yoy, housing_price_m2_primary_yoy, housing_price_m2_secondary_yoy, loans_corporate_yoy,
                         loans_sme_issued_yoy, loans_sme_debt_yoy, loans_sme_overdue_yoy,
                         # цены на топливо и ЖКУ (ЕМИСС 31448): 4 seed – LightGBM −1,3%, CatBoost +1,0%, не включены
                         prices_fuel_utilities_ai92_yoy, prices_fuel_utilities_diesel_yoy, prices_fuel_utilities_power_yoy, prices_fuel_utilities_water_cold_yoy,
                         prices_fuel_utilities_water_hot_yoy, prices_fuel_utilities_heating_yoy, prices_fuel_utilities_gas_yoy]
      backend: lightgbm
      n_estimators: 400
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      random_state: 42
  # Без номера целевого месяца: при обучении на январе–сентябре модель не
  # видела октябрь–декабрь и применяла к ним поведение сентября (занижение
  # на 3–5%). Сезонность передаётся через seas_step (прошлогодний сдвиг).
  - name: lgbm_global_nomonth
    model: global
    params:
      exclude_features: [target_month,
                         # без пользы в features_cmp (наборы ext и sme)
                         basket_cost_yoy, housing_price_m2_primary_yoy, housing_price_m2_secondary_yoy, loans_corporate_yoy,
                         loans_sme_issued_yoy, loans_sme_debt_yoy, loans_sme_overdue_yoy,
                         # цены на топливо и ЖКУ (ЕМИСС 31448): 4 seed – LightGBM −1,3%, CatBoost +1,0%, не включены
                         prices_fuel_utilities_ai92_yoy, prices_fuel_utilities_diesel_yoy, prices_fuel_utilities_power_yoy, prices_fuel_utilities_water_cold_yoy,
                         prices_fuel_utilities_water_hot_yoy, prices_fuel_utilities_heating_yoy, prices_fuel_utilities_gas_yoy]
      backend: lightgbm
      n_estimators: 400
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      random_state: 42
