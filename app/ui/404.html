<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SberIndex: страница не найдена</title>
<!-- Самодостаточная страница: на GitHub Pages она отдаётся по любому адресу,
     поэтому без внешних файлов, а ссылки строятся от корня сайта. -->
<style>
:root{--bg:#f4f4f0;--paper:#fff;--ink:#15191e;--ink2:#434b55;--muted:#6b7480;--edge:rgba(21,25,30,.09);--accent:#21a038}
@media (prefers-color-scheme:dark){:root{--bg:#0c0e10;--paper:#12161b;--ink:#e6eaef;--ink2:#b6bec8;--muted:#8a93a0;--edge:rgba(255,255,255,.08)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);
  font-family:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(80vmax 60vmax at -10% -14%,rgba(33,160,56,.15),transparent 60%),var(--bg)}
main{max-width:560px;width:100%}
.code{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:13px;color:var(--muted);margin:0 0 14px}
.code b{color:var(--accent);font-weight:500}
h1{font-size:clamp(30px,5vw,44px);line-height:1.08;letter-spacing:-.025em;margin:0 0 14px}
p{color:var(--ink2);font-size:17px;line-height:1.5;margin:0 0 24px}
svg{display:block;width:100%;height:auto;margin:0 0 28px}
nav{display:flex;gap:10px;flex-wrap:wrap}
a{display:inline-block;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px}
a.main{background:var(--ink);color:var(--bg)} a.main:hover{background:var(--accent);color:#fff}
a.alt{border:1px solid var(--edge);background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<main>
  <p class="code"><b>404</b> / страница не найдена</p>
  <h1>Здесь ряд обрывается</h1>
  <!-- ряд расходов, который уходит в «н/д»: та же метафора, что в таблицах горизонтов -->
  <svg viewBox="0 0 560 120" role="img" aria-label="Линия графика обрывается">
    <path d="M0 78 L46 70 L92 74 L138 58 L184 64 L230 50 L276 56 L322 44" fill="none" stroke="#21a038" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M322 44 L560 30" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".35"/>
    <circle cx="322" cy="44" r="5" fill="#21a038"/>
    <text x="336" y="72" font-size="13" fill="currentColor" opacity=".55" font-family="ui-monospace,Consolas,monospace">н/д</text>
  </svg>
  <p>Такого адреса нет. Возможно, ссылка устарела или в ней опечатка.</p>
  <nav><a class="main" id="toLanding" href="/ui/landing.html">Итоги проекта</a><a class="alt" id="toTerminal" href="/ui/terminal.html">Терминал</a></nav>
</main>
<script>
// корень сайта: на сервере – «/», на GitHub Pages проекта – «/имя-репозитория/»
(function(){
  const path=location.pathname, i=path.indexOf('/ui/');
  let base=i>=0?path.slice(0,i+1):'/';
  if(i<0&&location.hostname.endsWith('github.io')){const seg=path.split('/')[1];if(seg)base='/'+seg+'/';}
  document.getElementById('toLanding').href=base+'ui/landing.html';
  document.getElementById('toTerminal').href=base+'ui/terminal.html';
})();
</script>
</body>
</html>
